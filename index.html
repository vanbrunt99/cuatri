<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuatri · Organizador universitario</title>
<meta name="description" content="Organizador de materias, notas, pendientes y programa de 15 semanas.">
<meta name="theme-color" content="#0A0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuatri">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:20px;--r-sm:14px;--tab-h:60px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --bg:#0A0D14;--bg-glass:rgba(10,13,20,.82);--statusbar:#0A0D14;
  --card:#131927;--card2:#1A2233;--input:#1A2132;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#EEF1F6;--muted:#A3ACBC;--dim:#6E788B;
  --accent:#D9B676;--accent-2:#B8914B;--accent-ink:#17120A;--accent-soft:rgba(217,182,118,.14);
  --danger:#FF6B6B;--danger-soft:rgba(255,107,107,.14);
  --warn:#F5B94A;--warn-soft:rgba(245,185,74,.15);
  --ok:#3DD68C;--ok-soft:rgba(61,214,140,.14);
  --info:#6AA8FF;--info-soft:rgba(106,168,255,.15);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --hero:linear-gradient(145deg,#1B2438 0%,#121827 60%,#0F1420 100%);
  color-scheme:dark;
}
html[data-theme=light]{
  --bg:#F3F4F7;--bg-glass:rgba(243,244,247,.86);--statusbar:#0E1525;
  --card:#FFFFFF;--card2:#F1F3F7;--input:#EEF0F4;--line:rgba(14,21,37,.09);--line2:rgba(14,21,37,.16);
  --text:#0E1525;--muted:#556074;--dim:#8A93A4;
  --accent:#9C7431;--accent-2:#7E5C22;--accent-ink:#FFFFFF;--accent-soft:rgba(156,116,49,.12);
  --danger:#D63B3B;--danger-soft:rgba(214,59,59,.1);
  --warn:#B4741A;--warn-soft:rgba(180,116,26,.12);
  --ok:#17905A;--ok-soft:rgba(23,144,90,.1);
  --info:#2F6FD6;--info-soft:rgba(47,111,214,.1);
  --shadow:0 10px 30px rgba(14,21,37,.12);
  --hero:linear-gradient(145deg,#141C2F 0%,#1D2741 100%);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  html[data-theme=system]{
    --bg:#F3F4F7;--bg-glass:rgba(243,244,247,.86);--statusbar:#0E1525;
    --card:#FFFFFF;--card2:#F1F3F7;--input:#EEF0F4;--line:rgba(14,21,37,.09);--line2:rgba(14,21,37,.16);
    --text:#0E1525;--muted:#556074;--dim:#8A93A4;
    --accent:#9C7431;--accent-2:#7E5C22;--accent-ink:#FFFFFF;--accent-soft:rgba(156,116,49,.12);
    --danger:#D63B3B;--danger-soft:rgba(214,59,59,.1);
    --warn:#B4741A;--warn-soft:rgba(180,116,26,.12);
    --ok:#17905A;--ok-soft:rgba(23,144,90,.1);
    --info:#2F6FD6;--info-soft:rgba(47,111,214,.1);
    --shadow:0 10px 30px rgba(14,21,37,.12);
    --hero:linear-gradient(145deg,#141C2F 0%,#1D2741 100%);
    color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  padding:0 calc(16px + var(--sar)) calc(var(--tab-h) + var(--sab) + 96px) calc(16px + var(--sal));min-height:100vh;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;z-index:60;top:0;left:0;right:0;height:var(--sat);background:var(--statusbar)}
body.sheet-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none}
.ic{width:22px;height:22px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{max-width:760px;margin:0 auto}
/* Encabezado */
.top{padding-top:calc(var(--sat) + 10px);margin-bottom:14px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.title{font-size:32px;line-height:1.1;font-weight:750;letter-spacing:-.025em;margin:6px 0 0}
.subtitle{color:var(--muted);font-size:15px;margin-top:4px}
.sem-chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px 0 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);max-width:78%}
.sem-chip span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sem-chip .ic{width:16px;height:16px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.live-dot.arch{background:var(--dim);box-shadow:0 0 0 3px var(--line)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;font-weight:600;font-size:16px;margin-left:-6px}
.back .ic{width:24px;height:24px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text)}
.icon-btn .ic{width:20px;height:20px}
/* Secciones */
.section{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.section a,.section button.lnk{font-size:14px;font-weight:600;color:var(--accent);min-height:32px;display:inline-flex;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:10px}
.stack>*+*{margin-top:8px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
/* Hero */
.hero{background:var(--hero);border-radius:24px;padding:20px 18px 18px;color:#EEF1F6;position:relative;overflow:hidden;border:1px solid rgba(217,182,118,.22);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(217,182,118,.22),transparent 70%)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#D9B676;font-weight:700}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px;position:relative;z-index:1}
.big{font-size:64px;line-height:.95;font-weight:780;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:#9AA4B5;font-weight:600;letter-spacing:-.01em;margin-left:2px}
.big.txt{font-size:34px;letter-spacing:-.02em}
.hero-side{text-align:right;font-size:14px;color:#B9C1CF;line-height:1.35}
.hero-side b{display:block;font-size:26px;color:#fff;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#B8914B,#E9CB8F)}
.strip{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:12px}
.strip i{height:22px;border-radius:5px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:10px;font-style:normal;color:#8E98AA;font-weight:600}
.strip i.p{background:rgba(217,182,118,.28);color:#E9D2A3}
.strip i.c{background:#D9B676;color:#17120A;font-weight:800}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:#B9C1CF;position:relative;z-index:1;flex-wrap:wrap}
.hero-foot button{color:#E9CB8F;font-weight:650;min-height:36px;padding:0 2px}
.tag-manual{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(217,182,118,.2);color:#E9CB8F;margin-left:6px;vertical-align:2px}
/* Tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.tile .n{font-size:36px;font-weight:760;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.tile .l::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--dim))}
.tile.t-danger .n{color:var(--danger)}.tile.t-warn .n{color:var(--warn)}.tile.t-info .n{color:var(--info)}.tile.t-ok .n{color:var(--ok)}
/* Banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-top:12px;font-size:14.5px}
.banner .ic{width:20px;height:20px;margin-top:1px}
.banner.danger{background:var(--danger-soft);border-color:transparent}.banner.danger .ic{color:var(--danger)}
.banner.warn{background:var(--warn-soft);border-color:transparent}.banner.warn .ic{color:var(--warn)}
.banner.info{background:var(--info-soft);border-color:transparent}.banner.info .ic{color:var(--info)}
.banner.ok{background:var(--ok-soft);border-color:transparent}.banner.ok .ic{color:var(--ok)}
.banner.accent{background:var(--accent-soft);border-color:transparent}.banner.accent .ic{color:var(--accent)}
.banner b{display:block;margin-bottom:2px}
.banner .acts{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.banner .acts button,.banner .acts a{font-weight:700;color:var(--accent);min-height:32px}
.inbox-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.inbox-item:first-of-type{border-top:0}
/* Items */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:stretch;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden;width:100%;text-align:left}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stripe,transparent)}
.item.f-overdue{--stripe:var(--danger)}.item.f-soon{--stripe:var(--warn)}
.item.is-done .item-title{text-decoration:line-through;color:var(--dim)}
.check{width:52px;flex:none;display:grid;place-items:center;min-height:56px}
.check::before{content:"";width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);grid-area:1/1;transition:.15s}
.check .ic{grid-area:1/1;width:16px;height:16px;color:transparent;stroke-width:3}
.check.on::before{background:var(--ok);border-color:var(--ok)}
.check.on .ic{color:#06150D}
.item-body{flex:1;min-width:0;padding:12px 14px 12px 0;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:56px;justify-content:center}
.item-body.pad{padding-left:14px}
.item-title{font-weight:640;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.item-meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.item-meta i{font-style:normal;color:var(--dim)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:2px;flex:none}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:750;letter-spacing:.02em;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.danger{background:var(--danger-soft);color:var(--danger)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.info{background:var(--info-soft);color:var(--info)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.item-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:10px 14px 10px 6px;flex:none;text-align:right}
.grade{font-size:26px;font-weight:760;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.grade.none{color:var(--dim);font-size:20px}
.item-side small{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap}
.eval-ic{width:52px;flex:none;display:grid;place-items:center}
.eval-ic span{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.eval-ic .ic{width:18px;height:18px}
.empty{text-align:center;padding:26px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line2);border-radius:var(--r);font-size:15px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn .ic{width:19px;height:19px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn-col{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.fab{position:fixed;z-index:40;right:calc(18px + var(--sar));bottom:calc(var(--tab-h) + var(--sab) + 16px);width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.fab .ic{width:26px;height:26px;stroke-width:2.4}
.fab[hidden]{display:none}
/* Materias */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:150px}
.scard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.scard .nm{font-weight:700;font-size:15.5px;line-height:1.25;min-height:2.5em}
.scard .avg{font-size:34px;font-weight:770;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.scard .avg small{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0;display:block;margin-top:4px}
.scard .mini{font-size:12.5px;color:var(--muted);line-height:1.35}
.minibar{height:6px;border-radius:999px;background:var(--card2);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--c);border-radius:inherit}
.good{color:var(--ok)}.mid{color:var(--warn)}.bad{color:var(--danger)}
.srow{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;width:100%;text-align:left}
.srow + .srow{margin-top:10px}
.srow .sw{width:12px;align-self:stretch;border-radius:6px;background:var(--c);flex:none}
.srow .info{flex:1;min-width:0}
.srow .info b{display:block;font-size:17px;line-height:1.25}
.srow .info span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .r{text-align:right;flex:none}
.srow .r b{font-size:26px;font-weight:760;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1}
.srow .r small{font-size:12px;color:var(--muted)}
.subhead{border-radius:22px;padding:18px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.subhead::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,transparent),transparent 65%);pointer-events:none}
.subhead>*{position:relative}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:14px 0 4px;position:sticky;top:var(--sat);z-index:20}
.tabs a,.tabs button{flex:1;text-align:center;padding:10px 4px;border-radius:10px;font-weight:650;font-size:14px;color:var(--muted);min-height:40px}
.tabs .on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 var(--line2)}
.kv{display:grid;grid-template-columns:1fr;gap:0}
.kv>div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.kv>div:first-child{border-top:0}
.kv span{color:var(--muted);flex:none}
.kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.notes-box{white-space:pre-wrap;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.kpi-n{font-size:27px;font-weight:770;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi-n small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}
.kpi-l{font-size:12.5px;font-weight:650;color:var(--muted);margin-top:8px;line-height:1.25}
.kpi-s{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.25}
.stackbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--card2);margin-top:14px}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
/* Programa */
.week{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.week + .week{margin-top:8px}
.week.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.week.past .wk-h{opacity:.72}
.wk-h{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:60px;text-align:left}
.wk-n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;background:var(--card2);color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.week.current .wk-n{background:var(--accent);color:var(--accent-ink)}
.week.past .wk-n{background:var(--ok-soft);color:var(--ok)}
.wk-t{flex:1;min-width:0}
.wk-t b{display:block;font-size:15.5px}
.wk-t span{display:block;font-size:13px;color:var(--muted)}
.wk-h .ic{width:18px;height:18px;color:var(--dim);transition:transform .2s}
.week.open .wk-h .ic.chev{transform:rotate(180deg)}
.wk-b{padding:0 14px 14px;display:none}
.week.open .wk-b{display:block}
.witem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.witem:first-child{border-top:0}
.witem .wchk{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;margin-top:1px}
.witem .wchk .ic{width:15px;height:15px;color:transparent;stroke-width:3}
.witem .wchk.on{background:var(--ok);border-color:var(--ok)}.witem .wchk.on .ic{color:#06150D}
.witem .wbody{flex:1;min-width:0;text-align:left;min-height:30px}
.witem .wbody b{font-weight:600;font-size:15px;display:block;overflow-wrap:anywhere}
.witem.done .wbody b{text-decoration:line-through;color:var(--dim)}
.witem .wbody .wd{font-size:13px;color:var(--muted);display:block;white-space:pre-wrap;overflow-wrap:anywhere}

}

const mondayOf = s => { const d = parseD(s); return addDays(s, -((d.getDay() + 6) % 7)); };
const fmtD = (s, o) => new Intl.DateTimeFormat('es-CR', o).format(parseD(s));
const fmtShort = s => fmtD(s, {weekday:'short', day:'numeric', month:'short'}).replace(/\./g,'');
const fmtLong = s => fmtD(s, {weekday:'long', day:'numeric', month:'long'});
const fmtDM = s => fmtD(s, {day:'numeric', month:'short'}).replace(/\./g,'');
const fmtDMY = s => fmtD(s, {day:'numeric', month:'short', year:'numeric'}).replace(/\./g,'');
const fmtTime = t => { if (!t) return ''; const [h,m] = t.split(':').map(Number); const d = new Date(2000,0,1,h,m); return new Intl.DateTimeFormat('es-CR', {hour:'numeric', minute:'2-digit'}).format(d).replace(/\s?a\.?\s?m\.?/i,' a. m.').replace(/\s?p\.?\s?m\.?/i,' p. m.'); };
const cap1 = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const rangeTxt = (a, b) => `${fmtDM(a)} – ${fmtDM(b)}`;

/* ---------- Estado ---------- */
function seedData() {
  const semId = uid();
  const now = new Date().toISOString();
  const sem = {id:semId, name:'Cuatrimestre sep–dic 2026', start:'2026-09-07', end:'2026-12-20', archived:false, weekOffset:0, createdAt:now};
  const subs = [['Ciberseguridad','#4C8DFF'],['Métodos de desarrollo de software','#2BB673'],['Programación avanzada','#A970FF'],['Gerencia de proyectos','#F2A93B']]
    .map(([name,color]) => ({id:uid(), semesterId:semId, name, color, teacher:'', room:'', schedule:'', link:'', notes:'', archived:false, createdAt:now}));
  return {sem, subs};
}
function emptyState() {
  return {
    app:'cuatri', version:1,
    semesters:[], subjects:[], evaluations:[], tasks:[], weekItems:[], inbox:[], notified:{},
    settings:{theme:'dark', passGrade:70, soonDays:3, reminderOffsets:[1440,60], notifications:false, installDismissed:false},
    ui:{viewSemesterId:null, agendaMode:'semana', filters:{subject:'', status:'activos', priority:'', week:'', sort:'fecha'}},
    meta:{createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()}
  };
}
function initialState() {
  const st = emptyState(); const {sem, subs} = seedData();
  st.semesters.push(sem); st.subjects.push(...subs); st.ui.viewSemesterId = sem.id;
  return st;
}
function migrate(d) {
  const def = emptyState();
  const out = Object.assign({}, def, d);
  out.settings = Object.assign({}, def.settings, d.settings || {});
  out.ui = Object.assign({}, def.ui, d.ui || {});
  out.ui.filters = Object.assign({}, def.ui.filters, (d.ui && d.ui.filters) || {});
  out.meta = Object.assign({}, def.meta, d.meta || {});
  ['semesters','subjects','evaluations','tasks','weekItems','inbox'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  if (!out.notified || typeof out.notified !== 'object' || Array.isArray(out.notified)) out.notified = {};
  if (!Array.isArray(out.settings.reminderOffsets)) out.settings.reminderOffsets = [1440,60];
  out.tasks.forEach(t => { if (!Array.isArray(t.reminders)) t.reminders = out.settings.reminderOffsets.slice(); if (!STATUSES[t.status]) t.status = 'pendiente'; if (!PRIORITIES[t.priority]) t.priority = 'media'; });
  out.semesters.forEach(s => { if (!isNum(s.weekOffset)) s.weekOffset = 0; });
  if (!out.semesters.find(s => s.id === out.ui.viewSemesterId)) out.ui.viewSemesterId = (out.semesters.find(s => !s.archived) || out.semesters[0] || {}).id || null;
  out.app = 'cuatri'; out.version = 1;
  return out;
}
let S; let storageOK = true;
const storageAvailable = (() => { try { const k = '__cuatri_test__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })();
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
function load() {
  try {
    const raw = storageAvailable ? localStorage.getItem(KEY) : null;
    if (raw) { S = migrate(JSON.parse(raw)); return; }
  } catch (e) { console.warn('No se pudo leer el almacenamiento', e); storageOK = false; }
  S = initialState(); persistNow(true);
}
let saveTimer = null;
function save() { S.meta.updatedAt = new Date().toISOString(); clearTimeout(saveTimer); saveTimer = setTimeout(persistNow, 200); }
function persistNow(silent) {
  clearTimeout(saveTimer); saveTimer = null;
  if (!storageAvailable) { storageOK = false; return; }
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; if (!silent) flashSaved(); }
  catch (e) { storageOK = false; toast('No se pudo guardar. El almacenamiento está lleno o bloqueado (¿navegación privada?). Exportá un respaldo.', {type:'danger', ms:7000}); }
}
function commit(fn) { fn && fn(); save(); render(); }
window.addEventListener('pagehide', () => { if (saveTimer) persistNow(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) persistNow(true); if (!document.hidden) { checkReminders(); softRefresh(); } });

/* ---------- Consultas ---------- */
const semById = id => S.semesters.find(s => s.id === id);
const viewSem = () => semById(S.ui.viewSemesterId) || null;
const subjectById = id => S.subjects.find(s => s.id === id);
const taskById = id => S.tasks.find(t => t.id === id);
const evalById = id => S.evaluations.find(e => e.id === id);
const subjectsOf = (semId, withArchived=false) => S.subjects.filter(s => s.semesterId === semId && (withArchived || !s.archived));
const semTasks = semId => S.tasks.filter(t => t.semesterId === semId);
const semEvals = semId => { const ids = new Set(S.subjects.filter(s => s.semesterId === semId).map(s => s.id)); return S.evaluations.filter(e => ids.has(e.subjectId)); };
const semOfSubject = id => { const s = subjectById(id); return s ? semById(s.semesterId) : null; };

function rawWeek(sem, dateStr) { return Math.floor(diffDays(sem.start, dateStr) / 7) + 1; }
function weekForDate(sem, dateStr) { return rawWeek(sem, dateStr) + (sem.weekOffset || 0); }
function currentWeek(sem) { return weekForDate(sem, todayISO()); }
function weekRange(sem, n) { const s = addDays(sem.start, (n - 1 - (sem.weekOffset || 0)) * 7); return [s, addDays(s, 6)]; }
function inWeeks(n) { return isNum(n) && n >= 1 && n <= WEEKS ? n : null; }
function semDays(sem) { return Math.max(1, diffDays(sem.start, sem.end) + 1); }
function semProgress(sem) { const el = clamp(diffDays(sem.start, todayISO()) + 1, 0, semDays(sem)); return el / semDays(sem); }
function taskSem(t) { return semById(t.semesterId); }
function taskWeek(t) { if (isNum(t.week)) return t.week; const sem = taskSem(t); return t.date && sem ? inWeeks(weekForDate(sem, t.date)) : null; }
function evalWeek(e) { if (isNum(e.week)) return e.week; const sem = semOfSubject(e.subjectId); return e.date && sem ? inWeeks(weekForDate(sem, e.date)) : null; }

function dueMoment(t) { if (!t.date) return null; const d = parseD(t.date); if (t.time) { const [h,m] = t.time.split(':').map(Number); d.setHours(h, m, 0, 0); } else d.setHours(23, 59, 0, 0); return d; }
function refMoment(t) { const d = parseD(t.date); if (t.time) { const [h,m] = t.time.split(':').map(Number); d.setHours(h, m, 0, 0); } else d.setHours(REF_HOUR_NO_TIME, 0, 0, 0); return d; }
function flag(t) {
  if (t.status === 'terminado') return 'done';
  if (!t.date) return 'nodate';
  const now = Date.now(), due = dueMoment(t).getTime();
  if (due < now) return 'overdue';
  if (due - now <= (S.settings.soonDays || 3) * 864e5) return 'soon';
  return 'later';
}
function byDue(a, b) { const A = a.date ? dueMoment(a).getTime() : Infinity, B = b.date ? dueMoment(b).getTime() : Infinity; return A - B || (PRIO_RANK[a.priority] - PRIO_RANK[b.priority]); }

function gradeStats(subjectId) {
  const evs = S.evaluations.filter(e => e.subjectId === subjectId);
  const totalWeight = sum(evs, e => e.weight || 0);
  const graded = evs.filter(e => isNum(e.grade));
  const gradedWeight = sum(graded, e => e.weight || 0);
  const points = sum(graded, e => (e.weight || 0) * e.grade / 100);
  const avg = gradedWeight > 0 ? points / gradedWeight * 100 : null;
  const remaining = Math.max(0, 100 - gradedWeight);
  const pendingWeight = totalWeight - gradedWeight; // registradas sin nota
  const pass = S.settings.passGrade || 70;
  const needed = remaining > 0 ? (pass - points) / remaining * 100 : null;
  return {evs, count:evs.length, gradedCount:graded.length, totalWeight, gradedWeight, points, avg, remaining, pendingWeight, pass, needed, over: totalWeight > 100.0001};
}
function gradeClass(v) { if (!isNum(v)) return ''; const p = S.settings.passGrade || 70; return v >= p ? 'good' : v >= p - 10 ? 'mid' : 'bad'; }

/* ---------- Rutas ---------- */
// Enrutador tolerante: usa el #hash cuando el navegador lo permite y, si no (vista previa aislada), funciona en memoria.
const hashRouting = (() => { try { return location.protocol !== 'about:' && location.protocol !== 'data:'; } catch (e) { return false; } })();
const readHash = () => { if (!hashRouting) return ''; try { return location.hash || ''; } catch (e) { return ''; } };
let curHash = /^#\/\w/.test(readHash()) ? readHash() : '#/inicio';
function route() { const h = curHash.replace(/^#\/?/, '') || 'inicio'; const [view, id, sub] = h.split('/'); return {view: view || 'inicio', id, sub}; }
function go(h) {
  curHash = h || '#/inicio';
  if (hashRouting) { try { if (readHash() !== curHash) location.hash = curHash; } catch (e) {} }
  closeSheetIfOpen(); render();
}

/* ---------- Componentes ---------- */
const badge = (t, c='') => `<span class="badge ${c}">${esc(t)}</span>`;
function semChip() {
  const s = viewSem();
  if (!s) return `<span></span>`;
  return `<button class="sem-chip" data-action="pick-semester" aria-label="Cambiar de cuatrimestre"><span class="live-dot ${s.archived ? 'arch' : ''}"></span><span class="t">${esc(s.name)}</span>${ic('down')}</button>`;
}
function topbar(title, {back='', actions='', sub=''} = {}) {
  return `<header class="top"><div class="top-row">${back ? `<a class="back" href="${back}">${ic('left')}<span>Atrás</span></a>` : semChip()}<div class="top-actions">${actions}</div></div><h1 class="title">${esc(title)}</h1>${sub ? `<div class="subtitle">${sub}</div>` : ''}</header>`;
}
function dueText(t) {
  if (!t.date) return 'Sin fecha';
  const d = diffDays(todayISO(), t.date);
  const day = d === 0 ? 'Hoy' : d === 1 ? 'Mañana' : d === -1 ? 'Ayer' : fmtShort(t.date);
  return day + (t.time ? ' · ' + fmtTime(t.time) : '');
}
function leftText(t) {
  const ms = dueMoment(t).getTime() - Date.now();
  const h = Math.floor(ms / 36e5);
  if (h < 1) return 'Vence en ' + Math.max(1, Math.round(ms / 6e4)) + ' min';
  if (h < 24) return 'Vence en ' + h + ' h';
  const d = Math.round(ms / 864e5); return d === 1 ? 'Vence en 1 día' : 'Vence en ' + d + ' días';
}
function overdueText(t) {
  const ms = Date.now() - dueMoment(t).getTime(); const d = Math.floor(ms / 864e5);
  if (d < 1) { const h = Math.max(1, Math.floor(ms / 36e5)); return 'Vencido hace ' + h + ' h'; }
  return 'Vencido hace ' + d + (d === 1 ? ' día' : ' días');
}
function taskRow(t, {showSubject=true, showDate=true} = {}) {
  const s = subjectById(t.subjectId); const f = flag(t); const done = t.status === 'terminado';
  const meta = [];
  if (showSubject) meta.push(`<span><span class="sdot" style="--c:${s ? s.color : 'var(--dim)'}"></span> ${esc(s ? s.name : 'General')}</span>`);
  if (showDate) meta.push(`<span>${esc(dueText(t))}</span>`);
  const w = taskWeek(t); if (w) meta.push(`<span>Sem. ${w}</span>`);
  const b = [];
  if (f === 'overdue') b.push(badge(overdueText(t), 'danger'));
  else if (f === 'soon') b.push(badge(leftText(t), 'warn'));
  if (t.status === 'progreso') b.push(badge('En progreso', 'info'));
  if (done) b.push(badge('Terminado', 'ok'));
  if (!done && t.priority === 'alta') b.push(badge('Prioridad alta', 'accent'));
  if (!done && t.priority === 'baja') b.push(badge('Prioridad baja'));
  if (t.evaluationId && evalById(t.evaluationId)) b.push(badge('↳ ' + evalById(t.evaluationId).name));
  return `<div class="item task f-${f} ${done ? 'is-done' : ''}">
    <button class="check ${done ? 'on' : ''}" data-action="toggle-done" data-id="${t.id}" aria-label="${done ? 'Marcar como pendiente' : 'Marcar como terminado'}">${ic('check')}</button>
    <button class="item-body" data-action="edit-task" data-id="${t.id}"><span class="item-title">${esc(t.title)}</span><span class="item-meta">${meta.join('<i>·</i>')}</span>${b.length ? `<span class="badges">${b.join('')}</span>` : ''}</button>
  </div>`;
}
function evalRow(e, {showSubject=true} = {}) {

  const g = isNum(e.grade);
  const meta = [];
  if (showSubject) meta.push(`<span>${esc(s.name)}</span>`);
  meta.push(`<span>Vale ${num(e.weight)}%</span>`);
  const w = evalWeek(e); if (w) meta.push(`<span>Sem. ${w}</span>`);
  if (e.date) meta.push(`<span>${esc(fmtShort(e.date))}</span>`);

    <span class="item-body"><span class="item-title">${esc(e.name)}</span><span class="item-meta">${meta.join('<i>·</i>')}</span>${late ? `<span class="badges">${badge('Fecha pasada · sin nota','warn')}</span>` : ''}</span>
    <span class="item-side"><span class="grade ${g ? gradeClass(e.grade) : 'none'}">${g ? num(e.grade, 2) : 'Sin nota'}</span>${g ? `<small>+${num(e.weight * e.grade / 100)} pts</small>` : `<small>${num(e.weight)}% del curso</small>`}</span>
  </button>`;
}

/* ---------- Vista: Inicio ---------- */
function viewInicio() {
  const sem = viewSem(); if (!sem) return noSemester('Inicio');
  const w = currentWeek(sem); const prog = semProgress(sem);
  const tasks = semTasks(sem.id);
  const overdue = tasks.filter(t => flag(t) === 'overdue').sort(byDue);
  const soon = tasks.filter(t => flag(t) === 'soon').sort(byDue);
  const inprog = tasks.filter(t => t.status === 'progreso').sort(byDue);
  const done = tasks.filter(t => t.status === 'terminado').sort((a,b) => (b.completedAt||'').localeCompare(a.completedAt||''));
  const today = todayISO();
  const evs = semEvals(sem.id);
  const upcoming = [
    ...tasks.filter(t => t.status !== 'terminado' && t.date && dueMoment(t).getTime() >= Date.now()).map(t => ({k:'t', at:dueMoment(t).getTime(), x:t})),
    ...evs.filter(e => !isNum(e.grade) && e.date && e.date >= today).map(e => ({k:'e', at:parseD(e.date).getTime() + 8*36e5, x:e}))
  ].sort((a,b) => a.at - b.at).slice(0, 8);
  const lateEvals = evs.filter(e => !isNum(e.grade) && e.date && e.date < today);

  let heroMain, heroSide;
  const wn = inWeeks(w);
  if (w < 1) { heroMain = `<div class="big txt">Por iniciar</div>`; heroSide = `<b>${diffDays(today, sem.start)}</b> días para iniciar`; }
  else if (w > WEEKS) { heroMain = `<div class="big txt">Finalizado</div>`; heroSide = `<b>100%</b> completado`; }
  else { const [a,b] = weekRange(sem, w); heroMain = `<div class="big">${w}<small>/${WEEKS}</small></div>`; heroSide = `${rangeTxt(a,b)}<b>${Math.round(prog*100)}%</b>del cuatrimestre`; }
  const strip = Array.from({length:WEEKS}, (_, i) => { const n = i + 1; const c = n === w ? 'c' : n < w ? 'p' : ''; return `<i class="${c}">${n}</i>`; }).join('');

  const inbox = S.inbox.filter(x => !x.read);
  const inboxHTML = inbox.length ? `<div class="banner accent">${ic('bell')}<div style="flex:1;min-width:0"><b>Recordatorios (${inbox.length})</b>${inbox.slice(0,4).map(x => `<div class="inbox-item"><button style="text-align:left" data-action="edit-task" data-id="${x.taskId}">${esc(x.text)}</button><span class="dim small" style="white-space:nowrap">${new Date(x.at).toLocaleTimeString('es-CR',{hour:'numeric',minute:'2-digit'})}</span></div>`).join('')}<div class="acts"><button data-action="inbox-clear">Marcar como leídos</button></div></div></div>` : '';

  const notifTip = (!S.settings.installDismissed && !isStandalone()) ? `<div class="banner info">${ic('phone')}<div><b>${isIOS() ? 'Instalala en tu iPhone' : 'Instalala como app'}</b>${isIOS() ? 'Agregala a la pantalla de inicio' : 'Instalala desde el navegador'} para usarla sin conexión y activar recordatorios compatibles.<div class="acts"><a href="#/ajustes">Ver cómo</a><button data-action="dismiss-install">Ocultar</button></div></div></div>` : '';

  const subs = subjectsOf(sem.id);
  const subCards = subs.length ? `<div class="sgrid">${subs.map(s => subjectCard(s)).join('')}</div>` : emptyBox('Sin materias', 'Agregá las materias de este cuatrimestre.', `<button class="btn primary" data-action="new-subject">${ic('plus')} Nueva materia</button>`);

  const thisWeekItems = wn ? S.weekItems.filter(x => x.week === wn && subs.some(s => s.id === x.subjectId)) : [];
  const weekHTML = wn ? `<div class="section"><h2>Programa · semana ${wn}</h2></div>${thisWeekItems.length ? `<div class="card">${thisWeekItems.slice(0,8).map(x => weekItemRow(x, true)).join('')}</div>` : `<div class="dayempty">No hay temas, lecturas ni clases cargadas para esta semana. Agregalos desde Materias → Programa.</div>`}` : '';

  return topbar('Inicio', {sub: cap1(fmtLong(today))}) + previewBanner() + archivedBanner(sem) + inboxHTML + notifTip + `
  <section class="hero" style="margin-top:12px">
    <div class="eyebrow">Semana actual${sem.weekOffset ? '<span class="tag-manual">Ajustada</span>' : ''}</div>
    <div class="hero-row">${heroMain}<div class="hero-side">${heroSide}</div></div>
    <div class="bar"><i style="width:${(prog*100).toFixed(1)}%"></i></div>
    <div class="strip" aria-hidden="true">${strip}</div>
    <div class="hero-foot"><span>${esc(fmtDMY(sem.start))} – ${esc(fmtDMY(sem.end))}</span><button data-action="adjust-week">Corregir semana</button></div>
  </section>
  <div class="tiles">
    <button class="tile t-danger" style="--c:var(--danger)" data-action="go-filter" data-f="vencidos"><span class="n">${overdue.length}</span><span class="l">Vencidos</span></button>
    <button class="tile t-warn" style="--c:var(--warn)" data-action="go-filter" data-f="proximos"><span class="n">${soon.length}</span><span class="l">Próximos a vencer</span></button>
    <button class="tile t-info" style="--c:var(--info)" data-action="go-filter" data-f="progreso"><span class="n">${inprog.length}</span><span class="l">En progreso</span></button>

  </div>
  ${lateEvals.length ? `<div class="banner warn">${ic('cap')}<div><b>${lateEvals.length} ${lateEvals.length === 1 ? 'evaluación' : 'evaluaciones'} con fecha pasada sin nota</b>${lateEvals.slice(0,3).map(e => esc(e.name)).join(', ')}${lateEvals.length > 3 ? '…' : ''}. Registrá la calificación cuando la tengás.</div></div>` : ''}
  <div class="home-cols"><div>
  ${overdue.length ? `<div class="section"><h2>Vencidos</h2><a href="#/agenda" data-action="go-filter" data-f="vencidos">Ver todos</a></div><div class="list">${overdue.slice(0,5).map(t => taskRow(t)).join('')}</div>` : ''}
  <div class="section"><h2>Próximos vencimientos</h2><a href="#/agenda">Agenda</a></div>
  ${upcoming.length ? `<div class="list">${upcoming.map(u => u.k === 't' ? taskRow(u.x) : evalRow(u.x)).join('')}</div>` : emptyBox('Todo al día', 'No tenés pendientes ni evaluaciones próximas.', `<button class="btn primary" data-action="new-task">${ic('plus')} Nuevo pendiente</button>`)}
  ${inprog.length ? `<div class="section"><h2>En progreso</h2></div><div class="list">${inprog.slice(0,5).map(t => taskRow(t)).join('')}</div>` : ''}
  </div><div>
  <div class="section"><h2>Materias</h2><a href="#/materias">Ver todas</a></div>
  ${subCards}
  ${weekHTML}
  ${done.length ? `<div class="section"><h2>Terminados recientemente</h2><a href="#/agenda" data-action="go-filter" data-f="terminado">Ver todos</a></div><div class="list">${done.slice(0,3).map(t => taskRow(t)).join('')}</div>` : ''}
  </div></div>`;
}

function viewAgenda() {

    body = navBar(rangeTxt(mon, sun), w ? 'Semana ' + w + ' del cuatrimestre' : 'Fuera del cuatrimestre', -7, 7, 'week');

      body += `<div class="dayblk ${d === today ? 'is-today' : ''}"><h3>${esc(cap1(fmtD(d, {weekday:'long', day:'numeric', month:'short'}).replace(/\./g,'')))}${d === today ? ' · hoy' : ''}<span class="cnt">${ts.length + es.length || ''}</span></h3>${dayList(sem.id, d, {compact:true})}</div>`;

}

let lastKey = null;
function setTab(t) { $$('.tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === t)); }
function render() {
  const r = route(); const key = curHash;
  const sameView = key === lastKey; const y = window.scrollY;
  let html = '';
  switch (r.view) {
    case 'materias': html = viewMaterias(); break;
    case 'materia': html = viewMateria(r.id, r.sub); break;
    case 'agenda': html = viewAgenda(); break;
    case 'ajustes': html = viewAjustes(); break;
    default: html = viewInicio();
  }
  $('#app').innerHTML = html;
  setTab(r.view === 'materia' ? 'materias' : (['materias','agenda','ajustes'].includes(r.view) ? r.view : 'inicio'));
  const v = ['materias','materia','agenda','ajustes'].includes(r.view) ? r.view : 'inicio';
  $('#fab').hidden = !viewSem() || !['inicio','agenda','materia'].includes(v);
  updateBadges();
  if (sameView) window.scrollTo(0, y);
  else {
    window.scrollTo(0, 0);
    if (r.view === 'materia' && r.sub === 'programa') { const c = $('.week.current'); if (c) setTimeout(() => c.scrollIntoView({block:'center'}), 30); }
  }
  lastKey = key;
  if (r.view === 'ajustes') storageInfo();
}
function softRefresh() { if (!$('#sheet-root').classList.contains('open')) render(); }
function updateBadges() {
  const live = S.semesters.filter(s => !s.archived).map(s => s.id);
  const n = S.tasks.filter(t => live.includes(t.semesterId) && flag(t) === 'overdue').length;
  const b = $('#bdg-inicio'); b.hidden = !n; b.textContent = n > 99 ? '99+' : n;
  const today = todayISO();
  const badgeN = n + S.tasks.filter(t => live.includes(t.semesterId) && t.status !== 'terminado' && t.date === today && flag(t) !== 'overdue').length;
  try { if ('setAppBadge' in navigator) { (badgeN ? navigator.setAppBadge(badgeN) : navigator.clearAppBadge()).catch(() => {}); } } catch (e) {}
}

  const t = S.settings.theme || 'dark';

/* ---------- UI: hoja, diálogo, toast ---------- */
let sheetSubmit = null;
function openSheet({title, body, submitText='Guardar', onSubmit=null, onOpen=null}) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="scrim" data-action="close-sheet"></div><form class="sheet" novalidate autocomplete="off"><div class="sheet-head"><button type="button" class="link" data-action="close-sheet">${onSubmit ? 'Cancelar' : 'Cerrar'}</button><h2>${esc(title)}</h2>${onSubmit ? `<button class="link strong" type="button" data-sheet-save>${esc(submitText)}</button>` : '<span></span>'}</div><div class="sheet-body">${body}</div></form>`;
  sheetSubmit = onSubmit;
  const form = root.querySelector('form');
  // Guardar con clic directo (funciona aunque el entorno bloquee el envío de formularios) y con Enter en campos de texto.
  const doSubmit = () => { if (!sheetSubmit) return; const ok = sheetSubmit(new FormData(form), form); if (ok !== false) closeSheet(); };
  form.addEventListener('submit', e => { e.preventDefault(); doSubmit(); });
  const saveBtn = form.querySelector('[data-sheet-save]'); if (saveBtn) saveBtn.addEventListener('click', e => { e.preventDefault(); doSubmit(); });
  form.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !['checkbox','radio','date','time'].includes(e.target.type)) { e.preventDefault(); doSubmit(); } });
  document.body.classList.add('sheet-open');
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
  if (onOpen) onOpen(form);
}
function closeSheet() {
  const root = $('#sheet-root'); root.classList.remove('open'); document.body.classList.remove('sheet-open'); sheetSubmit = null;
  setTimeout(() => { if (!root.classList.contains('open')) root.innerHTML = ''; }, 300);
}
function confirmDialog({title, message, confirmText='Confirmar', danger=false, requireText=''}) {
  return new Promise(res => {
    const root = $('#dialog-root');
    root.innerHTML = `<div class="dialog"><h3>${esc(title)}</h3><p>${message}</p>${requireText ? `<label class="field"><span>Escribí <b>${esc(requireText)}</b> para confirmar</span><input class="input" id="dlg-input" autocapitalize="characters" autocomplete="off"></label>` : ''}<div class="btn-row" style="margin-top:4px"><button class="btn" id="dlg-no">Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" id="dlg-yes" ${requireText ? 'disabled style="opacity:.45"' : ''}>${esc(confirmText)}</button></div></div>`;
    root.classList.add('open');
    const yes = $('#dlg-yes'), no = $('#dlg-no'), inp = $('#dlg-input');
    const close = v => { root.classList.remove('open'); root.innerHTML = ''; root.onclick = null; res(v); };
    if (inp) inp.addEventListener('input', () => { const ok = inp.value.trim().toUpperCase() === requireText; yes.disabled = !ok; yes.style.opacity = ok ? 1 : .45; });
    yes.addEventListener('click', () => close(true)); no.addEventListener('click', () => close(false));
    root.onclick = e => { if (e.target === root) close(false); };
  });
}
function toast(msg, {type='', actionText='', action=null, ms=3200} = {}) {
  const root = $('#toast-root'); while (root.children.length >= 1) root.firstChild.remove();
  const el = document.createElement('div'); el.className = 'toast ' + type; el.setAttribute('role', 'status');
  el.innerHTML = `<span class="t">${esc(msg)}</span>${actionText ? `<button>${esc(actionText)}</button>` : ''}`;
  if (actionText) el.querySelector('button').addEventListener('click', () => { action && action(); el.remove(); });
  root.appendChild(el);
  setTimeout(() => el.remove(), ms);
}
let savedT;

function onlineState() { $('#pill-off').classList.toggle('show', !navigator.onLine); }

/* ---------- Recordatorios y notificaciones ---------- */
function offsetText(m) { if (m === 0) return 'Vence ahora'; if (m < 60) return `Vence en ${m} min`; if (m < 1440) return `Vence en ${m / 60} h`; const d = m / 1440; return d === 7 ? 'Vence en 1 semana' : `Vence en ${d} ${d === 1 ? 'día' : 'días'}`; }
function checkReminders() {
  if (!S) return;
  const now = Date.now(); let changed = false;
  for (const t of S.tasks) {
    if (t.status === 'terminado' || !t.date || !(t.reminders || []).length) continue;
    const ts = taskSem(t); if (!ts || ts.archived) continue;
    const ref = refMoment(t).getTime();
    for (const off of t.reminders) {
      const fire = ref - off * 6e4;
      if (fire > now) continue;
      const k = `${t.id}|${off}|${t.date}|${t.time || ''}`;
      if (S.notified[k]) continue;
      S.notified[k] = now; changed = true;
      const late = now - fire;
      if (late > 3 * 864e5) continue; // demasiado viejo: se omite
      if (flag(t) === 'overdue') continue; // ya vencido: se ve en "Vencidos"
      const s = subjectById(t.subjectId);
      const when = off === 0 ? 'Vence ahora' : leftText(t);
      const text = `${t.title} — ${when}${s ? ' · ' + s.name : ''}`;
      S.inbox = S.inbox.filter(x => !(x.taskId === t.id && !x.read && x.at === now));
      S.inbox.unshift({id:uid(), taskId:t.id, text, at:now, read:false});
      if (late <= 30 * 6e4) {
        sysNotify(t.title, `${when} (${dueText(t)})${s ? ' · ' + s.name : ''}`, t.id);
        toast('⏰ ' + text, {ms:6000, actionText:'Ver', action:() => formTask(taskById(t.id))});
      }
    }
  }
  // limpieza
  const ids = new Set(S.tasks.map(t => t.id));
  for (const k of Object.keys(S.notified)) if (!ids.has(k.split('|')[0])) { delete S.notified[k]; changed = true; }
  if (S.inbox.length > 40) { S.inbox = S.inbox.slice(0, 40); changed = true; }
  if (changed) { save(); if (route().view === 'inicio') softRefresh(); }
  updateBadges();
}
async function sysNotify(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted' || !S.settings.notifications) return false;
  const opts = {body, tag: 'cuatri-' + (tag || uid()), icon:'icons/icon-192.png', badge:'icons/icon-192.png', data:{url:'./index.html#/inicio'}};
  try {
    if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { await reg.showNotification(title, opts); return true; } }
    new Notification(title, opts); return true;
  } catch (e) { console.warn(e); return false; }
}
async function enableNotifications() {
  if (!('Notification' in window)) { toast('Este navegador no admite notificaciones.', {type:'danger'}); return; }
  try {
    const p = await Notification.requestPermission();
    if (p === 'granted') { S.settings.notifications = true; save(); toast('Notificaciones activadas', {type:'ok'}); sysNotify('Cuatri', 'Las notificaciones están activadas.', 'activadas'); }
    else toast('No se otorgó el permiso. Los avisos se mostrarán dentro de la app.', {type:'danger', ms:5000});
  } catch (e) { toast('No se pudo pedir el permiso: ' + e.message, {type:'danger'}); }
  render();
}

/* ---------- Archivos: respaldo e .ics ---------- */
async function deliverFile(filename, text, mime, preferShare) {
  const file = new File([text], filename, {type:mime});
  if (preferShare && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:filename}); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}

  if (!data || !Array.isArray(data.semesters) || !Array.isArray(data.subjects)) { toast('El archivo no tiene el formato de respaldo de Cuatri.', {type:'danger', ms:5000}); return; }
  const n = data.semesters.length, m = data.subjects.length, t = (data.tasks || []).length, ev = (data.evaluations || []).length;
  const ok = await confirmDialog({title:'¿Restaurar este respaldo?', message:`Contiene ${n} cuatrimestre(s), ${m} materia(s), ${ev} evaluación(es) y ${t} pendiente(s)${obj.exportedAt ? ', exportado el ' + esc(new Date(obj.exportedAt).toLocaleString('es-CR', {dateStyle:'medium', timeStyle:'short'})) : ''}.<br><br><b>Reemplazará todos los datos actuales de este dispositivo.</b>`, confirmText:'Restaurar', danger:true});
  if (!ok) return;
  S = migrate(data); persistNow(); applyTheme(); go('#/inicio');
  toast('Respaldo restaurado', {type:'ok'});
}
function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
function icsFold(line) { const out = []; let s = line; while (s.length > 60) { out.push(s.slice(0, 60)); s = ' ' + s.slice(60); } out.push(s); return out.join('\r\n'); }
function icsLocal(d) { return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`; }
function buildICS(tasks) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cuatri//Organizador universitario//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Cuatri'];
  for (const t of tasks) {
    if (!t.date) continue;
    const s = subjectById(t.subjectId);
    L.push('BEGIN:VEVENT', `UID:${t.id}@cuatri.local`, `DTSTAMP:${stamp}`);
    if (t.time) { const st = refMoment(t); L.push(`DTSTART:${icsLocal(st)}`, `DTEND:${icsLocal(new Date(st.getTime() + 30 * 6e4))}`); }
    else L.push(`DTSTART;VALUE=DATE:${t.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(t.date, 1).replace(/-/g, '')}`);
    L.push(`SUMMARY:${icsEsc((s ? s.name + ': ' : '') + t.title)}`);
    const desc = [t.description, `Prioridad: ${PRIORITIES[t.priority]}`, `Estado: ${STATUSES[t.status]}`].filter(Boolean).join('\n');
    L.push(`DESCRIPTION:${icsEsc(desc)}`);
    for (const off of (t.reminders || [])) {
      let trig;
      if (t.time) trig = off === 0 ? 'PT0M' : `-PT${off}M`;
      else { const m = REF_HOUR_NO_TIME * 60 - off; trig = m >= 0 ? `PT${m}M` : `-PT${-m}M`; }
      L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(t.title)}`, `TRIGGER:${trig}`, 'END:VALARM');
    }
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
async function exportICS(tasks, name, share=false) {
  const list = tasks.filter(t => t.date && t.status !== 'terminado');
  if (!list.length) { toast('No hay pendientes abiertos con fecha para exportar.', {type:'danger'}); return; }
  const ok = await deliverFile(name, buildICS(list), 'text/calendar', share);
  if (ok) toast(`${list.length} pendiente(s) en el archivo .ics`, {type:'ok', ms:4500});
}
async function storageInfo() {
  const el = $('#storage-info'); if (!el || !navigator.storage) return;
  try {
    const persisted = navigator.storage.persisted ? await navigator.storage.persisted() : false;
    const est = navigator.storage.estimate ? await navigator.storage.estimate() : null;
    const size = new Blob([lsGet(KEY) || '']).size;
    el.textContent = `${storageOK ? 'Guardado automático activo.' : 'No se puede guardar.'} Datos: ${num(size / 1024, 1)} KB.${persisted ? ' Almacenamiento persistente concedido.' : ''}${est && est.quota ? ' Espacio disponible aprox.: ' + num((est.quota - (est.usage || 0)) / 1048576, 0) + ' MB.' : ''}`;
  } catch (e) {}
}

/* ---------- Acciones ---------- */
const A = {

  'new-task': el => { closeSheetIfOpen(); setTimeout(() => formTask(null, {subjectId:el.dataset.subject || '', week:el.dataset.week ? Number(el.dataset.week) : null, date:el.dataset.date || '', evaluationId:el.dataset.eval || ''}), sheetDelay()); },
  'edit-task': el => { const t = taskById(el.dataset.id); if (t) { closeSheetIfOpen(); setTimeout(() => formTask(t), sheetDelay()); } else toast('Este pendiente ya no existe.'); },

  },
  'delete-task': async el => {

    toast('Pendiente eliminado', {actionText:'Deshacer', action:() => commit(() => S.tasks.push(t))});
  },
  'task-ics': el => { const t = taskById(el.dataset.id); if (t) exportICS([t], `cuatri-${t.title.replace(/[^\w\-áéíóúñ ]/gi, '').slice(0, 30).trim().replace(/\s+/g, '-') || 'pendiente'}.ics`); },
  'export-ics': () => { const sem = viewSem(); exportICS(S.tasks.filter(t => !sem || t.semesterId === sem.id), `cuatri-pendientes-${todayISO()}.ics`); },
  'export-ics-share': () => { const sem = viewSem(); exportICS(S.tasks.filter(t => !sem || t.semesterId === sem.id), `cuatri-pendientes-${todayISO()}.ics`, true); },
  'new-eval': el => { closeSheetIfOpen(); setTimeout(() => formEval(null, {subjectId:el.dataset.subject, week:el.dataset.week ? Number(el.dataset.week) : null}), sheetDelay()); },
  'edit-eval': el => { const e = evalById(el.dataset.id); if (e) { closeSheetIfOpen(); setTimeout(() => formEval(e), sheetDelay()); } },
  'delete-eval': async el => {
    const e = evalById(el.dataset.id); if (!e) return;
    if (!await confirmDialog({title:'¿Eliminar evaluación?', message:`“${esc(e.name)}” (${num(e.weight)}%) se eliminará y dejará de contar en las notas.`, confirmText:'Eliminar', danger:true})) return;
    closeSheet();
    const linked = S.tasks.filter(t => t.evaluationId === e.id);
    commit(() => { S.evaluations = S.evaluations.filter(x => x.id !== e.id); linked.forEach(t => t.evaluationId = null); });
    toast('Evaluación eliminada', {actionText:'Deshacer', action:() => commit(() => { S.evaluations.push(e); linked.forEach(t => t.evaluationId = e.id); })});
  },
  'new-witem': el => formWeekItem(null, {subjectId:el.dataset.subject, week:Number(el.dataset.week)}),
  'edit-witem': el => { const x = S.weekItems.find(i => i.id === el.dataset.id); if (x) formWeekItem(x); },
  'toggle-witem': el => { const x = S.weekItems.find(i => i.id === el.dataset.id); if (x) commit(() => x.done = !x.done); },
  'delete-witem': async el => {
    const x = S.weekItems.find(i => i.id === el.dataset.id); if (!x) return;
    if (!await confirmDialog({title:'¿Eliminar contenido?', message:`“${esc(x.title)}” se quitará de la semana ${x.week}.`, confirmText:'Eliminar', danger:true})) return;
    closeSheet(); commit(() => S.weekItems = S.weekItems.filter(i => i.id !== x.id));
  },
  'toggle-week': el => { const k = el.dataset.key; openWeeks.has(k) ? openWeeks.delete(k) : openWeeks.add(k); const w = el.closest('.week'); w.classList.toggle('open'); el.setAttribute('aria-expanded', w.classList.contains('open')); },
  'new-subject': () => formSubject(null),
  'edit-subject': el => formSubject(subjectById(el.dataset.id)),
  'archive-subject': async el => {
    const s = subjectById(el.dataset.id); if (!s) return;
    if (!await confirmDialog({title:'¿Archivar materia?', message:`“${esc(s.name)}” dejará de aparecer en Inicio y en los formularios. Sus notas, programa y pendientes se conservan y podés restaurarla cuando quieras.`, confirmText:'Archivar'})) return;
    closeSheet(); commit(() => s.archived = true); go('#/materias'); toast('Materia archivada', {actionText:'Deshacer', action:() => commit(() => s.archived = false)});
  },
  'unarchive-subject': el => { const s = subjectById(el.dataset.id); if (!s) return; closeSheet(); commit(() => s.archived = false); toast('Materia restaurada', {type:'ok'}); },
  'delete-subject': async el => {
    const s = subjectById(el.dataset.id); if (!s) return;
    if (!await confirmDialog({title:'¿Eliminar materia definitivamente?', message:`Se eliminarán “${esc(s.name)}”, sus evaluaciones, su programa de 15 semanas y sus pendientes. No se puede deshacer.`, confirmText:'Eliminar', danger:true, requireText:'ELIMINAR'})) return;
    closeSheet();
    commit(() => { S.subjects = S.subjects.filter(x => x.id !== s.id); S.evaluations = S.evaluations.filter(x => x.subjectId !== s.id); S.weekItems = S.weekItems.filter(x => x.subjectId !== s.id); S.tasks = S.tasks.filter(x => x.subjectId !== s.id); });
    go('#/materias'); toast('Materia eliminada');
  },
  'toggle-arch-subjects': () => { showArchivedSubjects = !showArchivedSubjects; render(); },
  'pick-semester': () => pickSemester(),
  'view-sem': el => { closeSheet(); commit(() => S.ui.viewSemesterId = el.dataset.id); const r = route(); if (r.view === 'materia') go('#/materias'); toast('Viendo: ' + semById(el.dataset.id).name); },
  'new-sem': () => { closeSheetIfOpen(); setTimeout(() => formSemester(null), sheetDelay()); },
  'edit-sem': el => formSemester(semById(el.dataset.id)),
  'archive-sem': async el => {
    const s = semById(el.dataset.id); if (!s) return;
    if (!await confirmDialog({title:'¿Archivar cuatrimestre?', message:`“${esc(s.name)}” y todos sus datos se conservarán para consulta. Podés reactivarlo cuando quieras.`, confirmText:'Archivar'})) return;
    closeSheet();
    commit(() => { s.archived = true; if (S.ui.viewSemesterId === s.id) { const other = S.semesters.find(x => !x.archived); if (other) S.ui.viewSemesterId = other.id; } });

  },
  'unarchive-sem': el => { const s = semById(el.dataset.id); if (!s) return; closeSheet(); commit(() => { s.archived = false; S.ui.viewSemesterId = s.id; }); toast('Cuatrimestre reactivado', {type:'ok'}); },
  'delete-sem': async el => {
    const s = semById(el.dataset.id); if (!s) return;
    if (!await confirmDialog({title:'¿Eliminar cuatrimestre?', message:`Se eliminarán “${esc(s.name)}” con todas sus materias, notas, programas y pendientes. Si solo querés guardarlo, usá Archivar.`, confirmText:'Eliminar', danger:true, requireText:'ELIMINAR'})) return;
    closeSheet();
    commit(() => {
      const subIds = new Set(S.subjects.filter(x => x.semesterId === s.id).map(x => x.id));
      S.semesters = S.semesters.filter(x => x.id !== s.id); S.subjects = S.subjects.filter(x => !subIds.has(x.id));
      S.evaluations = S.evaluations.filter(x => !subIds.has(x.subjectId)); S.weekItems = S.weekItems.filter(x => !subIds.has(x.subjectId));
      S.tasks = S.tasks.filter(x => x.semesterId !== s.id);
      if (S.ui.viewSemesterId === s.id) S.ui.viewSemesterId = (S.semesters.find(x => !x.archived) || S.semesters[0] || {}).id || null;
    });
    toast('Cuatrimestre eliminado');
  },
  'adjust-week': () => formAdjustWeek(),
  'reset-week': () => { const s = viewSem(); closeSheet(); commit(() => s.weekOffset = 0); toast('Semana según cálculo automático', {type:'ok'}); },
  'seed': () => { const {sem, subs} = seedData(); commit(() => { S.semesters.forEach(x => x.archived = true); S.semesters.push(sem); S.subjects.push(...subs); S.ui.viewSemesterId = sem.id; }); toast('Datos iniciales cargados', {type:'ok'}); },
  'go-filter': el => { const f = el.dataset.f; S.ui.agendaMode = 'lista'; S.ui.filters = Object.assign({}, S.ui.filters, {status:f, subject:'', priority:'', week:'', sort:'fecha'}); save(); go('#/agenda'); },
  'agenda-mode': el => { S.ui.agendaMode = el.dataset.mode; save(); render(); },
  'agenda-nav': el => { const n = Number(el.dataset.n), u = el.dataset.unit; if (u === 'month') { const d = parseD(agendaDate); const nd = new Date(d.getFullYear(), d.getMonth() + n, 1); const t = todayISO(); agendaDate = iso(nd).slice(0,7) === t.slice(0,7) ? t : iso(nd); } else agendaDate = addDays(agendaDate, n); render(); },
  'agenda-today': () => { agendaDate = todayISO(); render(); },
  'agenda-day': el => { agendaDate = el.dataset.date; render(); },
  'filter-status': el => { S.ui.filters.status = el.dataset.v; save(); render(); },
  'filter-reset': () => { S.ui.filters = {subject:'', status:'activos', priority:'', week:'', sort:'fecha'}; save(); render(); },
  'inbox-clear': () => commit(() => S.inbox.forEach(x => x.read = true)),
  'dismiss-install': () => commit(() => S.settings.installDismissed = true),
  'notif-enable': () => enableNotifications(),
  'notif-disable': () => { commit(() => S.settings.notifications = false); toast('Notificaciones desactivadas. Seguirás viendo los avisos en la app.'); },
  'notif-test': async () => { const ok = await sysNotify('Cuatri · prueba', 'Así se verán tus recordatorios.', 'prueba'); toast(ok ? 'Notificación de prueba enviada' : 'No se pudo mostrar la notificación del sistema.', {type: ok ? 'ok' : 'danger'}); },
  'export-share': () => exportBackup(true),

    if (!navigator.storage || !navigator.storage.persist) { toast('Este navegador no permite pedir almacenamiento persistente. Hacé respaldos periódicos.', {ms:5000}); return; }
    try { const ok = await navigator.storage.persist(); toast(ok ? 'Almacenamiento persistente concedido' : 'El navegador no lo concedió por ahora. Instalala y usala seguido; hacé respaldos.', {type: ok ? 'ok' : '', ms:5000}); storageInfo(); } catch (e) { toast('No se pudo solicitar.', {type:'danger'}); }
  },
  'clear-all': async () => {
    if (!await confirmDialog({title:'¿Borrar todos los datos?', message:'Se eliminarán <b>todos</b> los cuatrimestres (activos y archivados), materias, evaluaciones, pendientes, programas y ajustes de este dispositivo. <b>No se puede deshacer.</b> Si no exportaste un respaldo, cancelá y hacelo primero.', confirmText:'Borrar todo', danger:true, requireText:'BORRAR'})) return;
    S = emptyState(); persistNow(); applyTheme(); go('#/inicio'); updateBadges();

  }
};
function closeSheetIfOpen() { if ($('#sheet-root').classList.contains('open')) closeSheet(); }
function sheetDelay() { return $('#sheet-root').innerHTML ? 260 : 0; }

document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#/"]');
  if (link && !link.dataset.action) { e.preventDefault(); go(link.getAttribute('href')); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = A[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'A' && el.dataset.action !== 'go-filter' && el.dataset.action !== 'close-sheet-go') return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'import-file') { if (el.files && el.files[0]) importBackup(el.files[0]); return; }
  if (el.dataset.filter) { S.ui.filters[el.dataset.filter] = el.value; save(); render(); return; }
  const k = el.dataset.setting; if (!k) return;
  if (k === 'theme') { S.settings.theme = el.value; applyTheme(); save(); return; }
  if (k === 'reminder') { S.settings.reminderOffsets = $$('[data-setting=reminder]').filter(x => x.checked).map(x => Number(x.value)).sort((a,b) => b - a); save(); flashSaved(); return; }
  if (k === 'soonDays') { S.settings.soonDays = Number(el.value); save(); return; }
  if (k === 'passGrade') { const v = parseNum(el.value); if (!isNum(v) || v < 0 || v > 100) { toast('La nota mínima debe estar entre 0 y 100.', {type:'danger'}); el.value = num(S.settings.passGrade); return; } S.settings.passGrade = v; save(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#dialog-root').classList.contains('open')) return; closeSheetIfOpen(); } });
window.addEventListener('hashchange', () => { const h = readHash() || '#/inicio'; if (h === curHash) return; curHash = h; closeSheetIfOpen(); render(); });
window.addEventListener('online', onlineState); window.addEventListener('offline', onlineState);
window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { try { S = migrate(JSON.parse(e.newValue)); render(); } catch (err) {} } });
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', applyTheme);

/* ---------- Service worker (sin conexión) ---------- */
function registerSW() {
  if (!swCapable()) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW', err));
  let shown = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !shown) { shown = true; toast('Hay una versión nueva de la app.', {actionText:'Recargar', action:() => location.reload(), ms:10000}); } });
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'open' && e.data.url) go(e.data.url.split('#')[1] ? '#' + e.data.url.split('#')[1] : '#/inicio'); });
}

/* ---------- Inicio ---------- */
load(); applyTheme(); onlineState();
try { if (hashRouting && !readHash()) history.replaceState(null, '', '#/inicio'); } catch (e) { /* vista previa aislada: se navega en memoria */ }
render();
registerSW();
checkReminders();
setInterval(checkReminders, 30000);
setInterval(() => { if (!document.hidden && !$('#sheet-root').classList.contains('open') && !$('#dialog-root').classList.contains('open')) { const t = todayISO(); if (t !== window.__lastDay) { window.__lastDay = t; render(); } } }, 60000);
window.__lastDay = todayISO();
